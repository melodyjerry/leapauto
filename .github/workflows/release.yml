name: Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        shell: pwsh
        continue-on-error: true
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $sdkmanager = Join-Path $sdkRoot 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (Test-Path $sdkmanager) {
            & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          } else {
            Write-Warning "sdkmanager not found under $sdkRoot; relying on preinstalled SDK components."
          }

      - name: Neutralize machine-specific Gradle settings
        shell: pwsh
        run: |
          $path = 'gradle.properties'
          $lines = Get-Content -LiteralPath $path
          $lines = $lines | Where-Object {
            $_ -notmatch '^\s*org\.gradle\.java\.home\s*='
          } | ForEach-Object {
            if ($_ -match '^\s*org\.gradle\.jvmargs\s*=') {
              'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8'
            } else {
              $_
            }
          }
          Set-Content -LiteralPath $path -Value $lines -Encoding utf8
          Write-Host "gradle.properties after CI fixup:"
          Get-Content -LiteralPath $path

      - name: Prepare signing from repository secrets
        id: signing
        shell: pwsh
        env:
          STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:STORE_FILE_B64)) { $missing += 'RELEASE_STORE_FILE_BASE64' }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PASSWORD)) { $missing += 'RELEASE_STORE_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:KEY_ALIAS)) { $missing += 'RELEASE_KEY_ALIAS' }
          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) { $missing += 'RELEASE_KEY_PASSWORD' }
          if ($missing.Count -gt 0) {
            Write-Warning ("Signing secrets not configured: " + ($missing -join ', ') + ". The release will be built unsigned and only uploaded as a workflow artifact.")
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          New-Item -ItemType Directory -Force -Path keystore | Out-Null
          [IO.File]::WriteAllBytes("keystore\ci-release.jks", [Convert]::FromBase64String($env:STORE_FILE_B64))
          @(
            "RELEASE_STORE_FILE=keystore/ci-release.jks",
            "RELEASE_STORE_PASSWORD=$($env:STORE_PASSWORD)",
            "RELEASE_KEY_ALIAS=$($env:KEY_ALIAS)",
            "RELEASE_KEY_PASSWORD=$($env:KEY_PASSWORD)"
          ) | Out-File -FilePath local.properties -Encoding ascii -Append
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run full unit test gate
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest --rerun-tasks

      - name: Package signed Release APK (10 MiB gate)
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Read version and release notes
        id: meta
        shell: pwsh
        run: |
          $build = Get-Content -LiteralPath app/build.gradle.kts -Raw
          $version = [regex]::Match($build, 'val\s+apkVersionName\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw "Could not read apkVersionName." }
          $apk = Get-ChildItem -LiteralPath app/build/distributions/release -Filter "*-$version.apk" | Select-Object -First 1
          if (-not $apk) { throw "Release APK not found for version $version." }
          $info = Get-Content -LiteralPath app/src/main/java/com/leapauto/app/AppReleaseInfo.kt -Raw
          $notes = [regex]::Match($info, 'currentReleaseNotes\s*=\s*"([^"]*)"').Groups[1].Value.Replace('\n', "`n")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes<<RELEASE_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $apksigner = Get-ChildItem -Path "$env:ANDROID_HOME\build-tools" -Recurse -Filter apksigner.bat | Sort-Object FullName | Select-Object -Last 1
          & $apksigner.FullName verify --verbose "${{ steps.meta.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leappauto-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.notes }}
          files: ${{ steps.meta.outputs.apk }}
          fail_on_unmatched_files: true
